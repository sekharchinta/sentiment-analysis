{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Emergency Dispatch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    <style>
        .admin-layout { display: grid; grid-template-columns: 240px 1fr; gap: 1.5rem; }
        .sidebar {
            position: sticky;
            top: 84px;
            height: fit-content;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.7));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.92rem;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .sidebar a:hover { color: var(--text); background: var(--surface-2); border-color: var(--border); }
        .sidebar a.active { color: #fff; background: var(--gradient); }
        .admin-content { min-width: 0; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.2rem; }
        @media (max-width: 900px) {
            .admin-layout { grid-template-columns: 1fr; }
            .sidebar { position: static; flex-direction: row; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-header-inner">
            <a href="{% url 'AdminHome' %}" class="brand">
                <span class="brand-badge">&#128737;</span>
                <span>Dispatch Admin Console</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="{% url 'AdminHome' %}" class="active">Home</a></li>
                    <li><a href="{% url 'RegisterUsersView' %}">Users</a></li>
                    <li><a href="{% url 'index' %}">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="app-main">
        <div class="admin-layout">
            <aside class="sidebar">
                <a href="{% url 'AdminHome' %}" class="active">&#127968; Home</a>
                <a href="{% url 'RegisterUsersView' %}">&#128101; User Details</a>
                <a href="{% url 'index' %}">&#128682; Logout</a>
            </aside>
            <section class="admin-content">
                {% block contents %}{% endblock %}
            </section>
        </div>
    </main>

    <footer class="app-footer">
        &copy; 2025 Emergency Calls for Enhanced Police Dispatch Services
    </footer>

</body>
</html>
