{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Emergency Calls for Enhanced Police Dispatch Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(to right, rgb(30, 58, 138), rgb(49, 46, 129), rgb(88, 28, 135));
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            padding: 1.25rem;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(to right, rgb(96, 165, 250), rgb(34, 211, 238), rgb(45, 212, 191));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        .layout {
            display: flex;
            flex: 1;
        }

        .navbar {
            width: 240px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(51, 65, 85, 0.5);
            padding: 2rem 1rem;
            flex-shrink: 0;
        }

        .navbar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .navbar ul li { margin-bottom: 0.75rem; }

        .navbar ul li a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            padding: 0.75rem 1.25rem;
            border: 1px solid rgba(51, 65, 85, 0.4);
            border-radius: 0.5rem;
            background: rgba(30, 41, 59, 0.5);
            transition: all 0.3s ease;
        }

        .navbar ul li a:hover {
            color: #fff;
            background: linear-gradient(to right, #2563eb, #06b6d4);
            border-color: transparent;
            transform: translateX(4px);
        }

        .main-content {
            flex: 1;
            padding: 2rem;
        }

        .content-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            min-height: 60vh;
        }

        footer {
            background: linear-gradient(to right, rgb(30, 58, 138), rgb(49, 46, 129), rgb(88, 28, 135));
            color: #cbd5e1;
            text-align: center;
            padding: 1rem;
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .navbar { width: 100%; border-right: none; border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Emergency Calls for Enhanced Police Dispatch Services</h1>
    </header>

    <div class="layout">
        <nav class="navbar">
            <ul>
                <li><a href="{% url 'AdminHome' %}">Home</a></li>
                <li><a href="{% url 'RegisterUsersView' %}">User Details</a></li>
                <li><a href="{% url 'index' %}">Logout</a></li>
            </ul>
        </nav>

        <div class="main-content">
            <div class="content-box">
                {% block contents %}{% endblock %}
            </div>
        </div>
    </div>

    <footer>
        © 2025 Emergency Calls for Enhanced Police Dispatch Services
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
