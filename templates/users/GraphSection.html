{% extends 'users/userbase.html' %}
{% load static %}

{% block contents %}
<style>
    .graph-wrap { max-width: 800px; margin: 0 auto; }
</style>

<div class="graph-wrap">
    <h2 class="page-title text-center">ML Models Accuracy Comparison</h2>

    {% if combined_accuracy_chart %}
        <div class="chart-frame">
            <img src="data:image/png;base64,{{ combined_accuracy_chart }}" alt="Model accuracy comparison chart">
        </div>
    {% elif error %}
        <div class="card">
            <div style="text-align:center; font-size:2.2rem;">&#128202;</div>
            <p class="text-center text-muted mt-2">{{ error }}</p>
            <div class="text-center mt-3">
                <a href="{% url 'training' %}" class="btn btn-primary">Go to Training</a>
            </div>
        </div>
    {% endif %}
</div>
{% endblock %}
