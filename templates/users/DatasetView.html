{% extends 'users/userbase.html' %}
{% load static %}

{% block contents %}
<style>
    .dataset-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .search-box { max-width: 380px; width: 100%; position: relative; }
    .search-box input { padding-left: 2.4rem; }
    .search-box::before {
        content: '&#128269;';
        position: absolute;
        left: 0.9rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.95rem;
        opacity: 0.6;
    }
    @media (max-width: 600px) {
        .table thead { display: none; }
        .table tbody td { display: block; border-top: none; }
        .table tbody tr { display: block; border-top: 1px solid var(--border); }
        .table tbody td::before { content: attr(data-label); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    }
</style>

<div class="dataset-head">
    <h2 class="page-title" style="margin-bottom:0;">Dataset Viewer</h2>
    <div class="search-box">
        <input type="text" class="form-control" id="searchInput" placeholder="Search table..." onkeyup="filterTable()">
    </div>
</div>

<div class="table-wrap">
    <table class="table" id="datasetTable">
        <thead>
            <tr>
                {% for column in d.columns %}
                    <th>{{ column }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in d.values %}
                <tr>
                    {% for cell in row %}
                        <td data-label="{{ d.columns.forloop.parentloop.counter0 }}">{{ cell }}</td>
                    {% endfor %}
                </tr>
            {% empty %}
                <tr><td class="table-empty">No records found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toLowerCase();
        const rows = document.querySelectorAll("#datasetTable tbody tr");
        rows.forEach(row => {
            const text = Array.from(row.cells).map(td => td.textContent.toLowerCase()).join(" ");
            row.style.display = text.includes(filter) ? "" : "none";
        });
    }
</script>
{% endblock %}
