{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            margin: 0;
        }

        /* Updated navbar to match User Register style */
        .navbar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 999;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin: 0 20px;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #60a5fa;
        }

        .header {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-top: 100px;
            background: linear-gradient(to right, #60a5fa, #22d3ee, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 10px;
            height: 45px;
            padding: 10px;
            font-size: 15px;
        }

        .form-control::placeholder {
            color: #cbd5e1;
        }

        .btn-primary {
            background: linear-gradient(to right, #2563eb, #06b6d4);
            border: none;
            font-weight: 600;
            border-radius: 10px;
            height: 45px;
        }

        .btn-primary:hover {
            background: linear-gradient(to right, #1d4ed8, #0891b2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            border-radius: 10px;
            height: 45px;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .alert {
            color: #f87171;
            margin-top: 10px;
            text-align: center;
        }

        h3 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'AdminLogin' %}">Admin</a>
    <a href="{% url 'UserLogin' %}">User</a>
    <a href="{% url 'UserRegister' %}">Register</a>
</div>

<!-- Page Title -->
<div class="header">Sentiment Analysis for Smarter Emergency Response</div>

<!-- Login Form -->
<section class="login-container">
    <div class="card">
        <h3>User Login</h3>
        <form action="{% url 'UserLoginCheck' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" class="form-control" name="loginid" required placeholder="Enter Login ID" />
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="pswd" required placeholder="Enter Password" />
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
            <div class="mt-2">
                <button class="btn btn-secondary w-100" type="reset">Reset</button>
            </div>
            {% if messages %}
                <div class="alert">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
        </form>
    </div>
</section>

</body>
</html>
